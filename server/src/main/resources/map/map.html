<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Maps View</title>
    <link rel="stylesheet" href="static/style.css"/>
</head>
<body>
<!-- Loading indicator -->
<div id="loading">Loading Map...</div>

<!-- Search box -->
<div id="search-container">
    <input
            id="pac-input"
            type="text"
            placeholder="🔍 Search for a place..."
    />
</div>

<!-- Control Panel with Text Fields -->
<div id="control-panel">
   <div id="mini-control">
    <div class="mini-row">
        <input id="lat-input" type="number" step="0.000001" placeholder="Latitude" />
        <input id="lng-input" type="number" step="0.000001" placeholder="Longitude" />
        <input id="rad-input" type="number" step="1" placeholder="Radius" />

        <button id="apply-btn">Apply</button>
    </div>
</div>
</div>

<div id="map"></div>

<script th:inline="javascript">
    let GOOGLE_MAPS_CONFIG = {
      apiKey: /*[[${config.apiKey}]]*/,

      options: {
        defaultZoom: 15,
        initialLat: /*[[${config.initialLat}]]*/,
        initialLong: /*[[${config.initialLong}]]*/,
        initialRad: /*[[${config.initialRad}]]*/,

        circleStrokeColor: "#FF0000",
        circleFillColor: "#FF0000",
        circleStrokeOpacity: 0.8,
        circleFillOpacity: 0.15,
        circleStrokeWeight: 2,

        enableStreetView: true,
        enableFullscreen: true,
        enableZoomControl: true,
        enableMapTypeControl: true,
      }
    };
</script>

<script src="static/map.js"></script>

<script type="text/javascript">
  // Function called from Kotlin to update the map
  function updateMap(currentLat, currentLng, currentRad){
      updateMapLocation(currentLat, currentLng, currentRad)
  }
</script>

<script>
    // Load Google Maps API with the key from config
    (function () {
      if (
        typeof GOOGLE_MAPS_CONFIG === "undefined" ||
        !GOOGLE_MAPS_CONFIG.apiKey
      ) {
        console.error("Google Maps API key not configured!");
        document.getElementById("loading").innerHTML =
          "❌ Error: API key not configured<br><small>Please check config.js</small>";
        return;
      }

      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_CONFIG.apiKey}&libraries=places&callback=initMap`;
      script.async = true;
      script.defer = true;
      script.onerror = function () {
        console.error("Failed to load Google Maps API");
        document.getElementById("loading").innerHTML =
          "❌ Error: Failed to load Google Maps<br><small>Check your API key and internet connection</small>";
      };
      document.head.appendChild(script);
    })();
</script>
</body>
</html>
